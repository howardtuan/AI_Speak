version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai_speak_db
    environment:
      POSTGRES_DB: ai_speak
      POSTGRES_USER: ai_speak
      POSTGRES_PASSWORD: ai_speak_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: ai_speak_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  pgdata:
